spring.application.name=oe-calc.history

#Observabilitiy
management.endpoints.web.exposure.include=health,prometheus,info
management.tracing.enabled=true
management.tracing.sampling.probability=1.0
#management.otlp.tracing.endpoint=http://oe-calc-opentelemetry-collector.dev.svc.cluster.local:4318/v1/traces
otel.exporter.otlp.endpoint=http://oe-calc-opentelemetry-collector.dev.svc.cluster.local:4318
management.otlp.tracing.resource-attributes.service.name=${spring.application.name}
management.otlp.tracing.resource-attributes.deployment.environment=dev
management.tracing.propagation.type=W3C

#Hikari
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.data-source-properties.cachePrepStmts=true
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=250
spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=2048
spring.datasource.hikari.data-source-properties.useServerPrepStmts=true
spring.datasource.hikari.data-source-properties.rewriteBatchedStatements=true

#Jpa/Hibernate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.jdbc.fetch_size=100
spring.jpa.properties.hibernate.default_batch_fetch_size=25
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true
spring.jpa.properties.hibernate.query.plan_cache_max_size=2048
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true

#Flyway
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

#RabbitMQ
spring.rabbitmq.listener.simple.concurrency=3
spring.rabbitmq.listener.simple.max-concurrency=10
spring.rabbitmq.listener.simple.prefetch=50
spring.rabbitmq.listener.simple.batch-size=25
spring.rabbitmq.listener.simple.observe-enabled=true
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.cache.connection.mode=channel
spring.rabbitmq.cache.channel.size=25
spring.rabbitmq.cache.channel.checkout-timeout=5000

#Tomcat
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20
server.tomcat.accept-count=100
server.tomcat.max-connections=10000
server.tomcat.connection-timeout=5000
server.tomcat.keep-alive-timeout=60000
server.tomcat.max-keep-alive-requests=100

#Jackson
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=true