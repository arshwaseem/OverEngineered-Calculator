# ============================================================================
# FRONTEND
# ============================================================================

frontend:
  enabled: true
  replicaCount: 1  # Reduced from 2
  image:
    pullPolicy: IfNotPresent
  service:
    type: LoadBalancer
    port: 80
  resources:
    requests:
      memory: 64Mi   # Reduced from 128Mi
      cpu: 50m       # Reduced from 100m
    limits:
      memory: 128Mi  # Reduced from 256Mi
      cpu: 100m      # Reduced from 200m

# ============================================================================
# OBSERVABILITY STACK - Lightweight configuration
# ============================================================================

kube-prometheus-stack:
  enabled: true

  prometheus:
    enabled: true
    prometheusSpec:
      retention: 2d  # REDUCED from 3d
      retentionSize: 1GB  # REDUCED from 2GB

      resources:
        requests:
          memory: 256Mi  # REDUCED from 512Mi - Prometheus is memory hungry!
          cpu: 100m      # REDUCED from 200m
        limits:
          memory: 512Mi  # REDUCED from 1Gi - hard cap to prevent OOM
          cpu: 400m      # REDUCED from 500m

      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: local-path
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 3Gi  # REDUCED from 5Gi

      serviceMonitorSelector: {}
      serviceMonitorNamespaceSelector: {}
      podMonitorSelector: {}
      podMonitorNamespaceSelector: {}

      additionalScrapeConfigs:
        - job_name: 'kubernetes-pods'
          scrape_interval: 30s  # Increased from 15s to reduce load
          scrape_timeout: 10s
          kubernetes_sd_configs:
            - role: pod
              namespaces:
                names:
                  - dev
          relabel_configs:
            - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
              action: keep
              regex: true
            - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
              action: replace
              regex: ([^:]+)(?::\d+)?;(\d+)
              replacement: ${1}:${2}
              target_label: __address__
            - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
              action: replace
              regex: (.+)
              target_label: __metrics_path__
            - source_labels: [__meta_kubernetes_pod_name]
              action: replace
              target_label: pod
            - source_labels: [__meta_kubernetes_namespace]
              action: replace
              target_label: namespace
            - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
              action: replace
              target_label: service

      enableFeatures:
        - exemplar-storage

  grafana:
    enabled: true
    adminPassword: admin

    resources:
      requests:
        memory: 64Mi   # REDUCED from 128Mi
        cpu: 50m       # SAME
      limits:
        memory: 192Mi  # REDUCED from 256Mi
        cpu: 200m      # REDUCED from 250m

    persistence:
      enabled: true
      storageClassName: local-path
      size: 1Gi  # REDUCED from 2Gi

    service:
      type: LoadBalancer
      port: 80

    additionalDataSources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: "http://{{ .Release.Name }}-kube-prometheus-st-prometheus.{{ .Release.Namespace }}.svc.cluster.local:9090"
        isDefault: true
        jsonData:
          timeInterval: 30s  # Increased from 15s
          exemplarTraceIdDestinations:
            - name: trace_id
              datasourceUid: tempo

      - name: Tempo
        type: tempo
        access: proxy
        url: "http://{{ .Release.Name }}-tempo.{{ .Release.Namespace }}.svc.cluster.local:3100"
        isDefault: false
        jsonData:
          httpMethod: GET
          tracesToLogs:
            datasourceUid: 'loki'
            tags: ['job', 'instance', 'pod', 'namespace']
            mappedTags:
              - key: 'service.name'
                value: 'service'
            mapTagNamesEnabled: true
            spanStartTimeShift: '-1h'
            spanEndTimeShift: '1h'
          tracesToMetrics:
            datasourceUid: 'prometheus'
            tags:
              - key: 'service.name'
                value: 'service'
            queries:
              - name: 'TPS Last 5 Min'
                query: 'sum(rate(http_server_requests_seconds_count{service="$service"}[5m]))'
              - name: 'CPU Usage'
                query: 'rate(container_cpu_usage_seconds_total{pod=~"$service.*"}[5m])'
              - name: 'Memory Usage'
                query: 'container_memory_working_set_bytes{pod=~"$service.*"}'
          serviceMap:
            datasourceUid: 'prometheus'
          nodeGraph:
            enabled: true

    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: 'default'
            orgId: 1
            folder: ''
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/default

    dashboards:
      default:
        spring-boot-statistics:
          gnetId: 6756
          revision: 1
          datasource: Prometheus
        jvm-micrometer:
          gnetId: 4701
          revision: 7
          datasource: Prometheus

  alertmanager:
    enabled: false  # Disabled for local to save resources

  kubeStateMetrics:
    enabled: true
  nodeExporter:
    enabled: false  # Disabled for local
  prometheusOperator:
    enabled: true
    resources:
      requests:
        memory: 64Mi   # Reduced from 128Mi
        cpu: 50m       # Reduced from 100m
      limits:
        memory: 128Mi  # Reduced from 256Mi
        cpu: 250m      # Reduced from 500m

# ============================================================================
# TEMPO - Lightweight tracing
# ============================================================================

tempo:
  enabled: true

  tempo:
    repository: grafana/tempo
    tag: 2.5.0

    resources:
      requests:
        memory: 128Mi  # REDUCED from 256Mi
        cpu: 50m       # REDUCED from 100m
      limits:
        memory: 256Mi  # REDUCED from 512Mi - Tempo can be memory hungry
        cpu: 300m      # REDUCED from 500m

    retention: 48h  # REDUCED from 72h (3d) to 2d

    storage:
      trace:
        backend: local
        local:
          path: /var/tempo/traces
        wal:
          path: /var/tempo/wal

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      jaeger:
        protocols:
          grpc:
            endpoint: 0.0.0.0:14250
          thrift_http:
            endpoint: 0.0.0.0:14268
      zipkin:
        endpoint: 0.0.0.0:9411

  persistence:
    enabled: true
    storageClassName: local-path
    size: 3Gi  # REDUCED from 5Gi

  service:
    type: ClusterIP

  serviceMonitor:
    enabled: true
    interval: 30s  # Increased from 15s

# ============================================================================
# OPENTELEMETRY COLLECTOR - Single instance
# ============================================================================

opentelemetry-collector:
  enabled: true

  mode: deployment
  replicaCount: 1  # Single instance

  image:
    repository: otel/opentelemetry-collector-contrib

  resources:
    requests:
      memory: 128Mi  # REDUCED from 256Mi
      cpu: 50m       # REDUCED from 100m
    limits:
      memory: 256Mi  # REDUCED from 512Mi
      cpu: 300m      # REDUCED from 500m

  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

      prometheus:
        config:
          scrape_configs:
            - job_name: 'otel-collector'
              scrape_interval: 30s  # Increased from 15s
              static_configs:
                - targets: ['localhost:8888']

    processors:
      batch:
        timeout: 10s     # Increased from 5s
        send_batch_size: 1024  # Reduced from 2048

      memory_limiter:
        check_interval: 1s
        limit_mib: 200   # REDUCED from 400 to match new limit
        spike_limit_mib: 50  # REDUCED from 100

      resource:
        attributes:
          - key: cluster.name
            value: local
            action: upsert
          - key: deployment.environment
            value: local
            action: upsert

      attributes:
        actions:
          - key: service.namespace
            from_attribute: k8s.namespace.name
            action: upsert
          - key: service.instance.id
            from_attribute: k8s.pod.name
            action: upsert

    exporters:
      otlp/tempo:
        endpoint: "{{ .Release.Name }}-tempo.{{ .Release.Namespace }}.svc.cluster.local:4317"
        tls:
          insecure: true
        sending_queue:
          enabled: true
          num_consumers: 5  # Reduced from 10
          queue_size: 500   # Reduced from 1000

      debug:
        verbosity: basic
        sampling_initial: 5
        sampling_thereafter: 200

      prometheus:
        endpoint: "0.0.0.0:8889"

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch, resource, attributes]
          exporters: [otlp/tempo, debug]

        metrics:
          receivers: [prometheus]
          processors: [memory_limiter, batch]
          exporters: [prometheus, debug]

  service:
    type: ClusterIP

  ports:
    otlp:
      enabled: true
      containerPort: 4317
      servicePort: 4317
      protocol: TCP
    otlp-http:
      enabled: true
      containerPort: 4318
      servicePort: 4318
      protocol: TCP
    metrics:
      enabled: true
      containerPort: 8889
      servicePort: 8889
      protocol: TCP

  serviceMonitor:
    enabled: true