# Local Development Configuration - Ultra Lightweight
# Optimized for: 8th gen i7, 16GB RAM, WSL2
# 
# Usage: helm install oe-calculator ./oe-calculator -f ./oe-calculator/values-local.yaml -n dev
#
# REALISTIC Resource Budget (accounting for Windows bloat):
# - Total RAM available to K8s: ~6-7GB (Windows can take 9-10GB!)
# - Total CPU: 6-7 cores (leaving 1-2 for system)
# - Minimal replicas - focus on functionality over HA
# - Lightweight observability - just enough to learn tracing
#
# TOTAL MEMORY TARGET: ~4.5GB requests (leaving headroom for spikes)

global:
  imagePullPolicy: IfNotPresent
  environment: local
  imageTag: tracing

# ============================================================================
# INFRASTRUCTURE COMPONENTS
# ============================================================================

rabbitmq:
  enabled: true
  replicaCount: 1
  image:
    pullPolicy: IfNotPresent
  persistence:
    enabled: true
    size: 500Mi  # Minimal - just for message persistence
    storageClass: local-path
  resources:
    requests:
      memory: 128Mi  # CRITICAL: Reduced from 256Mi - RabbitMQ was your killer!
      cpu: 50m       # Reduced from 100m
    limits:
      memory: 256Mi  # CRITICAL: Hard cap at 256Mi to prevent OOM
      cpu: 200m      # Reduced from 250m
  env:
    # RabbitMQ memory tuning - CRITICAL for stability
    - name: RABBITMQ_VM_MEMORY_HIGH_WATERMARK
      value: "0.6"  # Trigger flow control at 60% of limit (153Mi)
    - name: RABBITMQ_VM_MEMORY_HIGH_WATERMARK_PAGING_RATIO
      value: "0.75"  # Start paging at 75% of watermark

# ============================================================================
# DATABASE CLUSTERS - Single instance for local
# ============================================================================

cnpg-postgres-users:
  enabled: true
  clusterName: postgres-users
  instances: 1  # Single instance for local (no HA needed)
  storage:
    size: 1Gi  # Minimal storage
    storageClass: local-path
  postgresql:
    parameters:
      max_connections: "50"  # REDUCED from 100 - fewer connections needed locally
      shared_buffers: "64MB"  # REDUCED from 128MB
      effective_cache_size: "256MB"  # REDUCED from 512MB
      work_mem: "4MB"  # REDUCED from 8MB
      maintenance_work_mem: "32MB"  # REDUCED from 64MB
  resources:
    requests:
      memory: 128Mi  # REDUCED from 256Mi
      cpu: 50m       # REDUCED from 100m
    limits:
      memory: 256Mi  # REDUCED from 512Mi - hard cap
      cpu: 300m      # REDUCED from 500m

cnpg-postgres-history:
  enabled: true
  clusterName: postgres-history
  instances: 1  # Single instance for local
  storage:
    size: 2Gi  # Still needs more than users DB for history
    storageClass: local-path
  postgresql:
    parameters:
      max_connections: "50"  # REDUCED from 100
      shared_buffers: "64MB"  # REDUCED from 128MB
      effective_cache_size: "256MB"  # REDUCED from 512MB
      work_mem: "4MB"  # REDUCED from 8MB
      maintenance_work_mem: "32MB"  # REDUCED from 64MB
      checkpoint_completion_target: "0.9"
      wal_buffers: "4MB"  # REDUCED from 8MB
      default_statistics_target: "100"
  resources:
    requests:
      memory: 128Mi  # REDUCED from 256Mi
      cpu: 50m       # REDUCED from 100m
    limits:
      memory: 256Mi  # REDUCED from 512Mi - hard cap
      cpu: 300m      # REDUCED from 500m

# ============================================================================
# APPLICATION SERVICES - Minimal replicas with resource limits
# ============================================================================

user-ms:
  enabled: true
  replicaCount: 1  # REDUCED from 2 - single instance sufficient for local
  image:
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 400m      # REDUCED from 500m
      memory: 384Mi  # REDUCED from 512Mi
    requests:
      cpu: 100m      # REDUCED from 200m
      memory: 256Mi  # REDUCED from 384Mi
  autoscaling:
    enabled: false  # Disabled for local - static replicas
  podDisruptionBudget:
    enabled: false  # Not needed for local
  initContainers:
    enabled: false

history-ms:
  enabled: true
  replicaCount: 1  # REDUCED from 2 - single instance for local
  image:
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 400m      # REDUCED from 500m
      memory: 512Mi  # REDUCED from 768Mi
    requests:
      cpu: 150m      # REDUCED from 250m
      memory: 384Mi  # REDUCED from 512Mi
  autoscaling:
    enabled: false  # Disabled for local
  podDisruptionBudget:
    enabled: false
  initContainers:
    enabled: false

auth:
  enabled: true
  replicaCount: 1  # REDUCED from 2 - single instance for local
  image:
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 400m      # REDUCED from 500m
      memory: 384Mi  # REDUCED from 512Mi
    requests:
      cpu: 150m      # REDUCED from 250m
      memory: 256Mi  # SAME as before
  autoscaling:
    enabled: false  # Disabled for local
  podDisruptionBudget:
    enabled: false
  serviceConfig:
    sessionAffinity: ClientIP
    sessionAffinityConfig:
      clientIP:
        timeoutSeconds: 10800
  initContainers:
    enabled: false

