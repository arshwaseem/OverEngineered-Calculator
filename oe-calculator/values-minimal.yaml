    pullPolicy: IfNotPresent
  service:
    type: LoadBalancer
    port: 80
  resources:
    requests:
      memory: 32Mi   # Minimal for nginx
      cpu: 25m
    limits:
      memory: 64Mi
      cpu: 100m

