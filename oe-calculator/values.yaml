global:
  imagePullPolicy: IfNotPresent  # Changed from Always - only pull if not present
  environment: dev
  imageTag: tracing

# Infrastructure Components
rabbitmq:
  enabled: true
  replicaCount: 1
  image:
    repository: rabbitmq
    tag: 3-management
    pullPolicy: IfNotPresent
  service:
    amqpPort: 5672
    managementPort: 15672
  persistence:
    enabled: true
    size: 2Gi  # Increased from 1Gi for history queue
    storageClass: local-path
  # Resource limits for RabbitMQ
  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 1Gi
      cpu: 500m

# Database Clusters
cnpg-postgres-users:
  enabled: true
  clusterName: postgres-users
  instances: 2  # Keep 2 for HA
  storage:
    size: 5Gi  # Increased from 1Gi
    storageClass: local-path
  database:
    name: users
    owner: app
  # PostgreSQL tuning
  postgresql:
    parameters:
      max_connections: "200"  # Increased to support 8 user-ms pods
      shared_buffers: "256MB"
      effective_cache_size: "1GB"
      work_mem: "16MB"
      maintenance_work_mem: "128MB"

cnpg-postgres-history:
  enabled: true
  clusterName: postgres-history
  instances: 2  # Keep 2 for HA
  storage:
    size: 10Gi  # Increased from 1Gi - history grows faster
    storageClass: local-path
  database:
    name: history
    owner: app
  # PostgreSQL tuning for write-heavy workload
  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: "256MB"
      effective_cache_size: "1GB"
      work_mem: "16MB"
      maintenance_work_mem: "128MB"
      # Write optimization
      checkpoint_completion_target: "0.9"
      wal_buffers: "16MB"
      default_statistics_target: "100"

# Application Services - Coordinated Configuration
user-ms:
  enabled: true
  replicaCount: 3  # Increased from 2
  image:
    repository: ghcr.io/arshwaseem/overengineered-calculator/user-ms
    tag: tracing
    pullPolicy: IfNotPresent
  database:
    host: postgres-users-rw
    port: 5432
    name: users
    secretName: postgres-users-app  # Fixed typo - was 'secret'
  # Override with optimized values
  resources:
    limits:
      cpu: 1000m
      memory: 1024Mi
    requests:
      cpu: 400m
      memory: 768Mi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 8
    targetCPUUtilizationPercentage: 65
  podDisruptionBudget:
    enabled: true
    minAvailable: 2
  initContainers:
    enabled: false

history-ms:
  enabled: true
  replicaCount: 3  # Increased from 2
  image:
    repository: ghcr.io/arshwaseem/overengineered-calculator/history-ms
    tag: tracing
    pullPolicy: IfNotPresent
  database:
    host: postgres-history-rw
    port: 5432
    name: history
    secretName: postgres-history-app  # Fixed typo
  rabbitmq:
    host: rabbitmq
    port: 5672
    secretName: rabbitmq-secret
  # Override with optimized values
  resources:
    limits:
      cpu: 1000m
      memory: 1536Mi
    requests:
      cpu: 500m
      memory: 1024Mi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 60
  podDisruptionBudget:
    enabled: true
    minAvailable: 2
  initContainers:
    enabled: false

auth:
  enabled: true
  replicaCount: 3  # Increased from 2
  image:
    repository: ghcr.io/arshwaseem/overengineered-calculator/auth
    tag: tracing
    pullPolicy: IfNotPresent
  env:
    user-ms:
      host: user-ms
      port: 8080
  # Override with optimized values
