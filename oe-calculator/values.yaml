  alertmanager:
    enabled: true
    alertmanagerSpec:
      resources:
        requests:
          memory: 64Mi
          cpu: 50m
        limits:
          memory: 128Mi
          cpu: 200m
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: local-path
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 2Gi  # Increased from 1Gi

  kubeStateMetrics:
    enabled: true
  nodeExporter:
    enabled: true
  prometheusOperator:
    enabled: true
    resources:
      requests:
        memory: 256Mi
        cpu: 250m
      limits:
        memory: 512Mi
        cpu: 500m

tempo:
  enabled: true
  
  tempo:
    repository: grafana/tempo
    tag: latest
    
    resources:
      requests:
        memory: 512Mi
        cpu: 500m
      limits:
        memory: 1Gi
        cpu: 1000m
    
    # CRITICAL: Run all components in single process
    target: all
    
    # Retention
    retention: 1h
    
    # Auth - disable for simplicity
    auth_enabled: false
    
    # Server
    server:
      http_listen_port: 3100
      grpc_listen_port: 9095
      log_level: info
    
    # Storage
    storage:
      trace:
        backend: local
        wal:
          path: /var/tempo/wal
        local:
          path: /var/tempo/blocks
    
    # Distributor (receives traces)
    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
    
    # Ingester (writes traces)
    ingester:
      lifecycler:
        ring:
          replication_factor: 1
          kvstore:
            store: inmemory
        join_after: 0s
        min_ready_duration: 1s
        final_sleep: 0s
      trace_idle_period: 10s
      max_block_bytes: 1000000
      max_block_duration: 5m
    
    # Compactor
    compactor:
      compaction:
        block_retention: 1h
    
    # Limits
    global_overrides:
      max_traces_per_user: 50000
      ingestion_rate_limit_bytes: 50000000
      ingestion_burst_size_bytes: 100000000
      max_bytes_per_trace: 5000000
      max_search_duration: 1h
  
  # Persistence
  persistence:
    enabled: true
    size: 10Gi
  
  # Service
  service:
    type: ClusterIP
  
  # Monitoring
  serviceMonitor:
    enabled: true


opentelemetry-collector:
  enabled: true

  mode: deployment
  replicaCount: 1

  image:
    repository: otel/opentelemetry-collector-contrib

  resources:
    requests:
      memory: 256Mi  # Increased for tail sampling
      cpu: 300m      # Increased for processing
    limits:
      memory: 512Mi    # Increased for tail sampling buffer
      cpu: 500m

  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

      prometheus:
        config:
          scrape_configs:
            - job_name: 'otel-collector'
              scrape_interval: 15s
              static_configs:
                - targets: ['localhost:8888']

    processors:
      # 1. Memory limiter - ALWAYS FIRST
      memory_limiter:
        check_interval: 1s
        limit_mib: 900
        spike_limit_mib: 250

      # 2. Filter out actuator/health check traces
      filter/drop_actuator:
        error_mode: ignore
        traces:
          span:
            # Filter by http.target (most common)
            - 'attributes["http.target"] != nil and IsMatch(attributes["http.target"], "^/actuator.*")'
            # Filter by http.route (Spring Boot)
            - 'attributes["http.route"] != nil and IsMatch(attributes["http.route"], "^/actuator.*")'
            # Filter by url.path (OTEL semantic conventions)
            - 'attributes["url.path"] != nil and IsMatch(attributes["url.path"], "^/actuator.*")'
            # Filter health checks
            - 'attributes["http.target"] != nil and IsMatch(attributes["http.target"], "^/health.*")'
            # Filter Kubernetes probes
            - 'attributes["http.user_agent"] != nil and IsMatch(attributes["http.user_agent"], ".*kube-probe.*")'

      # 3. Tail-based sampling - Smart trace selection
      tail_sampling:
        decision_wait: 10s  # Wait to collect all spans in a trace
        num_traces: 100000  # Number of traces to keep in memory
        expected_new_traces_per_sec: 100
        policies:
          # Policy 1: Keep ALL errors at 100%
          - name: errors-policy
            type: status_code
            status_code:
              status_codes: [ERROR]
          
          # Policy 2: Keep ALL slow requests (>500ms) at 100%
          - name: slow-requests-policy
            type: latency
            latency:
              threshold_ms: 500
          
          # Policy 3: Keep very slow requests (>1s) at 100%
          - name: very-slow-requests-policy
            type: latency
            latency:
              threshold_ms: 1000
          
          # Policy 4: API Gateway and Auth - 100% (critical services)
          - name: critical-services-policy
            type: string_attribute
            string_attribute:
              key: service.name
              values: ["auth", "api-gateway"]
              enabled_regex_matching: false
          
          # Policy 5: User and History services - 100% (important for debugging)
          - name: important-services-policy
            type: string_attribute
            string_attribute:
              key: service.name
              values: ["user-ms", "history-ms"]
              enabled_regex_matching: false
          
          # Policy 6: Arithmetic services - 30% sampling (high volume gRPC)
          # These get the most traffic but are simple operations
          - name: arithmetic-services-sample-policy
            type: and
            and:
              and_sub_policy:
                - name: is-arithmetic-service
                  type: string_attribute
                  string_attribute:
                    key: service.name
                    values: ["adder-ms", "subtractor-ms", "multiplier-ms", "divider-ms"]
                    enabled_regex_matching: false
                - name: probabilistic-30-percent
                  type: probabilistic
                  probabilistic:
                    sampling_percentage: 30
          
          # Policy 7: Default - sample everything else at 100%
          # This catches any new services or manual testing
          - name: default-policy
            type: always_sample

      # 4. Enhanced batch processor - Optimized for performance
      batch:
        timeout: 3s          # Send batch every 3 seconds
        send_batch_size: 4096  # Increased batch size
        send_batch_max_size: 8192

      # 5. Resource processor - Add cluster/environment info
      resource:
        attributes:
          - key: cluster.name
            value: rancher-desktop
            action: upsert
          - key: deployment.environment
            value: dev
            action: upsert

      # 6. Attributes processor - Add K8s metadata
      attributes:
        actions:
          - key: service.namespace
            from_attribute: k8s.namespace.name
            action: upsert
          - key: service.instance.id
            from_attribute: k8s.pod.name
            action: upsert

    exporters:
      # Tempo exporter
      otlp/tempo:
        endpoint: "{{ .Release.Name }}-tempo.{{ .Release.Namespace }}.svc.cluster.local:4317"
        tls:
          insecure: true
        sending_queue:
          enabled: true
          num_consumers: 20      # Increased from 10
          queue_size: 10000       # Increased from 1000
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s

      # Debug exporter - Reduced verbosity
      debug:
        verbosity: basic
        sampling_initial: 5
        sampling_thereafter: 500  # Less verbose

      # Prometheus exporter
      prometheus:
        endpoint: "0.0.0.0:8889"
        enable_open_metrics: true

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [
            memory_limiter,        # 1. Protect against OOM
            filter/drop_actuator,  # 2. Drop unwanted traces EARLY
            tail_sampling,         # 3. Smart sampling decisions
            batch,                 # 4. Batch for efficiency
            resource,              # 5. Add metadata
            attributes             # 6. Enrich with K8s data
          ]
          exporters: [otlp/tempo, debug]

        metrics:
          receivers: [prometheus]
          processors: [memory_limiter, batch]
          exporters: [prometheus, debug]

  service:
    type: ClusterIP

  ports:
    otlp:
      enabled: true
      containerPort: 4317
      servicePort: 4317
      protocol: TCP
    otlp-http:
      enabled: true
      containerPort: 4318
      servicePort: 4318
      protocol: TCP
    metrics:
      enabled: true
      containerPort: 8889
      servicePort: 8889
      protocol: TCP

  serviceMonitor:
    enabled: true