global:
  imagePullPolicy: IfNotPresent  # Changed from Always - only pull if not present
  environment: dev
  imagetag: latest

# Infrastructure Components
rabbitmq:
  enabled: true
  replicaCount: 1
  image:
    repository: rabbitmq
    tag: 3-management
    pullPolicy: IfNotPresent
  service:
    amqpPort: 5672
    managementPort: 15672
  persistence:
    enabled: true
    size: 2Gi  # Increased from 1Gi for history queue
    storageClass: local-path
  # Resource limits for RabbitMQ
  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 512Mi
      cpu: 500m

# Database Clusters
cnpg-postgres-users:
  enabled: true
  clusterName: postgres-users
  instances: 1  # Keep 2 for HA
  storage:
    size: 5Gi  # Increased from 1Gi
    storageClass: local-path
  database:
    name: users
    owner: app
  # PostgreSQL tuning
  postgresql:
    parameters:
      max_connections: "200"  # Increased to support 8 user-ms pods
      shared_buffers: "256MB"
      effective_cache_size: "1GB"
      work_mem: "16MB"
      maintenance_work_mem: "128MB"

cnpg-postgres-history:
  enabled: true
  clusterName: postgres-history
  instances: 1  # Keep 2 for HA
  storage:
    size: 10Gi  # Increased from 1Gi - history grows faster
    storageClass: local-path
  database:
    name: history
    owner: app
  # PostgreSQL tuning for write-heavy workload
  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: "256MB"
      effective_cache_size: "1GB"
      work_mem: "16MB"
      maintenance_work_mem: "128MB"
      # Write optimization
      checkpoint_completion_target: "0.9"
      wal_buffers: "16MB"
      default_statistics_target: "100"

# Application Services - Coordinated Configuration
user-ms:
  enabled: true
  replicaCount: 2  # Increased from 2
  image:
    repository: ghcr.io/arshwaseem/overengineered-calculator/user-ms
    tag: latest
    pullPolicy: IfNotPresent
  database:
    host: postgres-users-rw
    port: 5432
    name: users
    secretName: postgres-users-app  # Fixed typo - was 'secret'
  # Override with optimized values
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 400m
      memory: 256Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 85
  podDisruptionBudget:
    enabled: true
    minAvailable: 2
  initContainers:
    enabled: true

history-ms:
