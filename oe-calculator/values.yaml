# Observability Stack - Optimized
kube-prometheus-stack:
  enabled: true

  prometheus:
    enabled: true
    prometheusSpec:
      retention: 6h
      retentionSize: 300MB

      # Resource limits for prometheus
      resources:
        requests:
          memory: 512Mi
          cpu: 500m
        limits:
          memory: 1024Mi
          cpu: 500m

      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: local-path
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 10Gi  # Increased from 10Gi

      serviceMonitorSelector: {}
      serviceMonitorNamespaceSelector: {}
      podMonitorSelector: {}
      podMonitorNamespaceSelector: {}

      additionalScrapeConfigs:
        - job_name: 'kubernetes-pods'
          scrape_interval: 15s  # Changed from 30s for better granularity
          scrape_timeout: 10s
          kubernetes_sd_configs:
            - role: pod
              namespaces:
                names:
                  - dev
          relabel_configs:
            - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
              action: keep
              regex: true
            - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
              action: replace
              regex: ([^:]+)(?::\d+)?;(\d+)
              replacement: ${1}:${2}
              target_label: __address__
            - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
              action: replace
              regex: (.+)
              target_label: __metrics_path__
            - source_labels: [__meta_kubernetes_pod_name]
              action: replace
              target_label: pod
            - source_labels: [__meta_kubernetes_namespace]
              action: replace
              target_label: namespace
            - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
              action: replace
              target_label: service

      enableFeatures:
        - exemplar-storage

  grafana:
    enabled: true
    adminPassword: admin

    grafana.ini:
      dataproxy:
        timeout: 30s
        keep_alive_seconds: 30

      dashboards:
        min_refresh_interval: 10s

      caching:
        enabled: true

    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 500m

    persistence:
      enabled: true
      storageClassName: local-path
      size: 5Gi  # Increased from 2Gi

    service:
      type: LoadBalancer
      port: 80

    additionalDataSources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: "http://{{ .Release.Name }}-kube-prometheus-st-prometheus.{{ .Release.Namespace }}.svc.cluster.local:9090"
        isDefault: false  # Changed to default
        jsonData:
          timeInterval: 15s  # Changed from 30s
          exemplarTraceIdDestinations:
            - name: trace_id
              datasourceUid: tempo

      - name: Tempo
        type: tempo
        access: proxy
        url: "http://{{ .Release.Name }}-tempo.{{ .Release.Namespace }}.svc.cluster.local:3100"
        isDefault: false
        jsonData:
          httpMethod: GET
          tracesToLogs:
            datasourceUid: 'loki'
            tags: ['job', 'instance', 'pod', 'namespace']
            mappedTags:
              - key: 'service.name'
                value: 'service'
            mapTagNamesEnabled: true
            spanStartTimeShift: '-1h'
            spanEndTimeShift: '1h'
          tracesToMetrics:
            datasourceUid: 'prometheus'
            tags:
              - key: 'service.name'
                value: 'service'
            queries:
              - name: 'TPS Last 5 Min'
                query: 'sum(rate(http_server_requests_seconds_count{service="$service"}[5m]))'
              - name: 'CPU Usage'
                query: 'rate(container_cpu_usage_seconds_total{pod=~"$service.*"}[5m])'
              - name: 'Memory Usage'
                query: 'container_memory_working_set_bytes{pod=~"$service.*"}'
          serviceMap:
            datasourceUid: 'prometheus'
          nodeGraph:
            enabled: true

    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: 'default'
            orgId: 1
            folder: ''
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/default

    dashboards:
      default:
        spring-boot-statistics:
          gnetId: 6756
          revision: 1
          datasource: Prometheus
        jvm-micrometer:
          gnetId: 4701
          revision: 7
          datasource: Prometheus
        kubernetes-cluster:
          gnetId: 7249
          revision: 1
          datasource: Prometheus
        kubernetes-apiserver:
          gnetId: 15761
          revision: 16
          datasource: Prometheus

        oe-calc-services:
          json: |
            {
              "annotations": {
                "list": [
                  {
                    "builtIn": 1,
