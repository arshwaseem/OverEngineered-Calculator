global:
  imagePullPolicy: Always
  environment: dev
  imageTag: tracing

rabbitmq:
  enabled: true
  replicaCount: 1

  image:
    repository: rabbitmq
    tag: 3-management
    pullPolicy: IfNotPresent

  service:
    amqpPort: 5672
    managementPort: 15672

  persistence:
    enabled: true
    size: 1Gi
    storageClass: local-path

cnpg-postgres-users:
  enabled: true
  clusterName: postgres-users
  instances: 2
  storage:
    size: 1Gi
    storageClass: local-path
  database:
    name: users
    owner: app

cnpg-postgres-history:
  enabled: true
  clusterName: postgres-history
  instances: 2
  storage:
    size: 1Gi
    storageClass: local-path
  database:
    name: history
    owner: app

user-ms:
  enabled: true
  replicaCount: 2
  image:
    repository: ghcr.io/arshwaseem/overengineered-calculator/user-ms
    tag: tracing
    pullPolicy: IfNotPresent
  database:
    host: postgres-users-rw
    port: 5432
    name: users
    secret: postgres-users-app

history-ms:
  enabled: true
  replicaCount: 2
  image:
    repository: ghcr.io/arshwaseem/overengineered-calculator/history-ms
    tag: tracing
    pullPolicy: IfNotPresent
  database:
    host: postgres-history-rw
    port: 5432
    name: history
    secret: postgres-history-app

auth:
  enabled: true
  replicaCount: 2
  image:
    repository: ghcr.io/arshwaseem/overengineered-calculator/auth
    tag: tracing
    pullPolicy: IfNotPresent
  env:
    user-ms:
      host: user-ms
      port: 8080

adder-ms:
  enabled: true
  replicaCount: 2
  image:
    repository: ghcr.io/arshwaseem/overengineered-calculator/adder-ms
    tag: tracing
    pullPolicy: IfNotPresent
  env:
    rabbitmq:
      host: rabbitmq
      port: 5672
      username: guest

subtractor-ms:
  enabled: true
  replicaCount: 2
  image:
    repository: ghcr.io/arshwaseem/overengineered-calculator/subtractor-ms
    tag: tracing
    pullPolicy: IfNotPresent
  env:
    rabbitmq:
      host: rabbitmq
      port: 5672
      username: guest

multiplier-ms:
  enabled: true
  replicaCount: 2
  image:
    repository: ghcr.io/arshwaseem/overengineered-calculator/multiplier-ms
    tag: tracing
    pullPolicy: IfNotPresent
  env:
    rabbitmq:
      host: rabbitmq
      port: 5672
      username: guest

divider-ms:
  enabled: true
  replicaCount: 2
  image:
    repository: ghcr.io/arshwaseem/overengineered-calculator/divider-ms
    tag: tracing
    pullPolicy: IfNotPresent
  env:
    rabbitmq:
      host: rabbitmq
      port: 5672
      username: guest

api-gateway:
  enabled: true
  replicaCount: 2
  image:
    repository: ghcr.io/arshwaseem/overengineered-calculator/api-gateway
    tag: tracing
    pullPolicy: IfNotPresent
  env:
    rabbitmq:
      host: rabbitmq
      port: 5672
      username: guest

    adder-ms:
      host: adder-ms
      port: 9090

    subtractor-ms:
      host: subtractor-ms
      port: 9090

    multiplier-ms:
      host: multiplier-ms
      port: 9090

    divider-ms:
      host: divider-ms
      port: 9090

    auth:
      host: auth
      port: 8080

frontend:
  enabled: true
  replicaCount: 2
  image:
    repository: ghcr.io/arshwaseem/overengineered-calculator/frontend
    tag: tracing
    pullPolicy: IfNotPresent
  service:
    type: LoadBalancer
    port: 80
  api-gateway:
    host: api-gateway
    port: 8080


kube-prometheus-stack:
  enabled: true

  prometheus:
    enabled: true
    prometheusSpec:
      retention: 7d
      retentionSize: 5GB

      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: local-path
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 10Gi

      serviceMonitorSelector: {}
      serviceMonitorNamespaceSelector: {}

      podMonitorSelector: {}
      podMonitorNamespaceSelector: {}

      additionalScrapeConfigs:
        - job_name: 'kubernetes-pods'
          kubernetes_sd_configs:
            - role: pod
              namespaces:
                names:
                  - dev
          relabel_configs:
            - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
              action: keep
              regex: true

            - source_labels: [ __address__, __meta_kubernetes_pod_annotation_prometheus_io_port ]
              action: replace
              regex: ([^:]+)(?::\d+)?;(\d+)
              replacement: ${1}:${2}
              target_label: __address__

            - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
              action: replace
              regex: (.+)
              target_label: __metrics_path__

            - source_labels: [__meta_kubernetes_pod_name]
              action: replace
              target_label: pod

            - source_labels: [__meta_kubernetes_namespace]
              action: replace
              target_label: namespace

            - source_labels: [__meta_kubernetes_pod_label_app]
              action: replace
              target_label: service

      enableFeatures:
        - exemplar-storage


  grafana:
    enabled: true

    adminPassword: admin

    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 500m

    persistence:
      enabled: true
      storageClassName: local-path
      size: 2Gi

    service:
      type: LoadBalancer
      port: 80

    additionalDataSources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: "http://{{ .Release.Name }}-kube-prometheus-st-prometheus.{{ .Release.Namespace }}.svc.cluster.local:9090"
        isDefault: false
        jsonData:
          timeInterval: 30s
          exemplarTraceIdDestinations:
            - name: trace_id
              datasourceUid: tempo

      - name: Tempo
        type: tempo
        access: proxy
        url: "http://{{ .Release.Name }}-tempo.{{ .Release.Namespace }}.svc.cluster.local:3100"
        isDefault: false
        jsonData:
          httpMethod: GET
          tracesToLogs:
            datasourceUid: 'loki'
            tags: ['job', 'instance', 'pod', 'namespace']
            mappedTags:
              - key: 'service.name'
                value: 'service'
            mapTagNamesEnabled: true
            spanStartTimeShift: '-1h'
            spanEndTimeShift: '1h'
          tracesToMetrics:
            datasourceUid: 'prometheus'
            tags:
              - key: 'service.name'
                value: 'service'
            queries:
              - name: 'TPS Last 5 Min'
                query: 'sum(rate(http_server_requests_seconds_count[5m]))'
          serviceMap:
            datasourceUid: 'prometheus'
          nodeGraph:
            enabled: true

    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: 'default'
            orgId: 1
            folder: ''
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/default

    dashboards:
      default:
        spring-boot-statistics:
          gnetId: 6756
          revision: 1
          datasource: Prometheus

        jvm-micrometer:
          gnetId: 4701
          revision: 7
          datasource: Prometheus

        kubernetes-cluster:
          gnetId: 7249
          revision: 1
          datasource: Prometheus

  alertmanager:
    enabled: true
    alertmanagerSpec:
      resources:
        requests:
          memory: 64Mi
          cpu: 50m
        limits:
          memory: 128Mi
          cpu: 200m
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: local-path
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 1Gi

  kubeStateMetrics:
    enabled: true

  nodeExporter:
    enabled: true

  prometheusOperator:
    enabled: true
    resources:
      requests:
        memory: 128Mi
        cpu: 100m

      limits:
        memory: 256Mi
        cpu: 500m


tempo:
  enabled: true

  tempo:
    repository: grafana/tempo
    tag: 2.5.0

    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 1Gi
        cpu: 500m

    retention: 168h

    storage:
      trace:
        backend: local
        local:
          path: /var/tempo/traces
        wal:
          path: /var/tempo/wal

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      jaeger:
        protocols:
          grpc:
            endpoint: 0.0.0.0:14250
          thrift_http:
            endpoint: 0.0.0.0:14268

      zipkin:
        endpoint: 0.0.0.0:9411

  persistence:
    enabled: true
    storageClassName: local-path
    size: 10Gi

  service:
    type: ClusterIP

  serviceMonitor:
    enabled: true
    interval: 30s

opentelemetry-collector:
  enabled: true

  mode: deployment
  replicaCount: 1

  image:
    repository: otel/opentelemetry-collector-contrib

  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m

  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

      prometheus:
        config:
          scrape_configs:
            - job_name: 'otel-collector'
              scrape_interval: 30s
              static_configs:
                - targets: ['localhost:8888']

    processors:
      batch:
        timeout: 10s
        send_batch_size: 1024

      memory_limiter:
        check_interval: 1s
        limit_mib: 400
        spike_limit_mib: 100

      resource:
        attributes:
          - key: cluster.name
            value: rancher-desktop
            action: upsert
          - key: deployment.environment
            value: dev
            action: upsert

      attributes:
        actions:
          - key: service.namespace
            from_attribute: k8s.namespace.name
            action: upsert

          - key: service.instance.id
            from_attribute: k8s.pod.name
            action: upsert

    exporters:
      otlp/tempo:
        endpoint: "{{ .Release.Name }}-tempo.{{ .Release.Namespace}}.svc.cluster.local:4317"
        tls:
          insecure: true

      debug:
        verbosity: basic
        sampling_initial: 5
        sampling_thereafter: 200

      prometheus:
        endpoint: "0.0.0.0:8889"

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch, resource, attributes]
          exporters: [otlp/tempo, debug]

        metrics:
          receivers: [prometheus]
          processors: [memory_limiter, batch]
          exporters: [prometheus, debug]

  service:
    type: ClusterIP

  ports:
    otlp:
      enabled: true
      containerPort: 4317
      servicePort: 4317
      protocol: TCP
    otlp-http:
      enabled: true
      containerPort: 4318
      servicePort: 4318
      protocol: TCP
    metrics:
      enabled: true
      containerPort: 8889
      servicePort: 8889
      protocol: TCP

  serviceMonitor:
    enabled: true