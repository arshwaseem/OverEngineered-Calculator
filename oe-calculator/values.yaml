    port: 5432
    name: history
    secretName: postgres-history-app  # Fixed typo
  rabbitmq:
    host: rabbitmq
    port: 5672
    secretName: rabbitmq-secret
  # Override with optimized values
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 500m
      memory: 256Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 85
  podDisruptionBudget:
