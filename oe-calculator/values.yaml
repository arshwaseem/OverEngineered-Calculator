  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 15
    targetCPUUtilizationPercentage: 55
  podDisruptionBudget:
    enabled: true
    minAvailable: 2
  serviceConfig:
    sessionAffinity: ClientIP
    sessionAffinityConfig:
      clientIP:
        timeoutSeconds: 10800
  initContainers:
    enabled: false

