{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "divider-ms.fullname" . }}
  labels:
    {{- include "divider-ms.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "divider-ms.selectorLabels" . | nindent 6 }}
{{- end }}