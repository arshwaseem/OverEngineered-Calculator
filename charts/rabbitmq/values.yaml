replicaCount: 1

image:
  repository: rabbitmq
  pullPolicy: IfNotPresent
  tag: "3-management"

service:
  type: ClusterIP
  amqpPort: 5672
  managementPort: 15672

managementUI:
  enabled: true

persistence:
  enabled: true
  storageClass: local-path
  size: 1Gi

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

rabbitmq:
  configuration: |
    consumer_timeout = 1800000