apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "api-gateway.fullname" . }}
  labels:
    {{- include "api-gateway.labels" . | nindent 4 }}

spec:
  replicas: {{ .Values.replicaCount }}
  {{- if .Values.deploymentStrategy }}
  strategy:
    {{- toYaml .Values.deploymentStrategy | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "api-gateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- if .Values.podAnnotations }}
        {{- toYaml .Values.podAnnotations | nindent 8 }}
        {{- end }}
      labels:
        {{- include "api-gateway.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
      {{- if .Values.securityContext }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      {{- end }}
      {{- if and .Values.topologySpreadConstraints .Values.topologySpreadConstraints.enabled }}
      topologySpreadConstraints:
      - maxSkew: {{ .Values.topologySpreadConstraints.maxSkew }}
        topologyKey: {{ .Values.topologySpreadConstraints.topologyKey }}
        whenUnsatisfiable: {{ .Values.topologySpreadConstraints.whenUnsatisfiable }}
        labelSelector:
          matchLabels:
            {{- include "api-gateway.selectorLabels" . | nindent 12 }}
      {{- end }}
      {{- if .Values.dnsConfig }}
      dnsConfig:
        {{- toYaml .Values.dnsConfig | nindent 8 }}
      {{- end }}
      {{- if .Values.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- end }}
      {{- if and .Values.initContainers .Values.initContainers.enabled }}
      initContainers:
        - name: wait-for-all-services
          image: busybox:latest
          command:
              - sh
              - -c
              - |
                until nc -z -v -w30 {{ .Release.Name }}-{{ index .Values.env "auth" "host" }} {{ index .Values.env "auth" "port" }}; do
                 echo "Waiting for auth service connection..."
                 sleep 5
                done
                echo "Connected to auth service!"
                until nc -z -v -w30 {{ .Release.Name }}-{{ index .Values.env "adder-ms" "host" }} {{ index .Values.env "adder-ms" "port" }}; do
                  echo "Waiting for adder microservice connection..."
                  sleep 5
                done
                echo "Connected to adder microservice!"
                until nc -z -v -w30 {{ .Release.Name }}-{{ index .Values.env "subtractor-ms" "host" }} {{ index .Values.env "subtractor-ms" "port" }}; do
                  echo "Waiting for subtractor microservice connection..."
                  sleep 5
                done
                echo "Connected to subtractor microservice!"
                until nc -z -v -w30 {{ .Release.Name }}-{{ index .Values.env "multiplier-ms" "host" }} {{ index .Values.env "multiplier-ms" "port" }}; do
                  echo "Waiting for multiplier microservice connection..."
                  sleep 5
                done
                echo "Connected to multiplier microservice!"
                until nc -z -v -w30 {{ .Release.Name }}-{{ index .Values.env "divider-ms" "host" }} {{ index .Values.env "divider-ms" "port" }}; do
                  echo "Waiting for divider microservice connection..."
                  sleep 5
                done
                echo "Connected to divider microservice!"
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
              name: http
              protocol: TCP
          env:
            - name: GRPC_ADD_HOST
              value: {{ .Release.Name }}-{{ index .Values.env "adder-ms" "host" }}
            - name: GRPC_ADD_PORT
              value: {{ index .Values.env "adder-ms" "port" | quote }}
            - name: GRPC_SUBTRACT_HOST
              value: {{ .Release.Name }}-{{ index .Values.env "subtractor-ms" "host" }}
            - name: GRPC_SUBTRACT_PORT
              value: {{ index .Values.env "subtractor-ms" "port" | quote }}
            - name: GRPC_MULTIPLY_HOST
              value: {{ .Release.Name }}-{{ index .Values.env "multiplier-ms" "host" }}
            - name: GRPC_MULTIPLY_PORT
              value: {{ index .Values.env "multiplier-ms" "port" | quote }}
            - name: GRPC_DIVIDE_HOST
              value: {{ .Release.Name }}-{{ index .Values.env "divider-ms" "host" }}
            - name: GRPC_DIVIDE_PORT
              value: {{ index .Values.env "divider-ms" "port" | quote }}
            - name: AUTH_SERVICE_URL
              value: http://{{ .Release.Name }}-{{ index .Values.env "auth" "host" }}:{{ index .Values.env "auth" "port" }}
            # Java/Spring Boot optimization environment variables
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0 -XX:+UseG1GC -XX:MaxGCPauseMillis=100 -XX:+ParallelRefProcEnabled"
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          {{- end }}
          {{- if .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          {{- end }}
          {{- if .Values.startupProbe }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          {{- end }}