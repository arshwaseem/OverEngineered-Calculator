apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "auth.fullname" . }}
  labels:
    {{- include "auth.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if .Values.deploymentStrategy }}
  strategy:
    {{- toYaml .Values.deploymentStrategy | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "auth.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- if .Values.podAnnotations }}
        {{- toYaml .Values.podAnnotations | nindent 8 }}
        {{- end }}
      labels:
        {{- include "auth.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
      {{- if .Values.securityContext }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      {{- end }}
      {{- if and .Values.topologySpreadConstraints .Values.topologySpreadConstraints.enabled }}
      topologySpreadConstraints:
      - maxSkew: {{ .Values.topologySpreadConstraints.maxSkew }}
        topologyKey: {{ .Values.topologySpreadConstraints.topologyKey }}
        whenUnsatisfiable: {{ .Values.topologySpreadConstraints.whenUnsatisfiable }}
        labelSelector:
          matchLabels:
            {{- include "auth.selectorLabels" . | nindent 12 }}
      {{- end }}
      {{- if .Values.dnsConfig }}
      dnsConfig:
        {{- toYaml .Values.dnsConfig | nindent 8 }}
      {{- end }}
      {{- if .Values.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- end }}
      {{- if and .Values.initContainers .Values.initContainers.enabled }}
      initContainers:
        - name: wait-for-userms
          image: busybox:latest
          command:
            - sh
            - -c
            - |
              until nc -z {{ .Release.Name }}-{{ index .Values.env "user-ms" "host" }} {{ index .Values.env "user-ms" "port" }}; do
              echo "Waiting for User MS to be available..."
              sleep 5
              done
              echo "User MS is available."
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: USER_SERVICE_URL
              value: http://{{ .Release.Name }}-{{ index .Values.env "user-ms" "host" }}:{{ index .Values.env "user-ms" "port" }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "auth.fullname" . }}-secret
                  key: jwt-secret
            - name: JWT_ISSUER
              value: {{ .Values.env.jwt.issuer }}
            - name: JWT_ACCESS_EXPIRATIONSECONDS
              value: {{ .Values.env.jwt.expiration | quote }}
            - name: JWT_REFRESH_EXPIRATIONSECONDS
              value: {{ .Values.env.jwt.refreshExpiration | quote }}
            - name: COOKIE_HTTPONLY
              value: {{ .Values.env.jwt.httpOnly | quote }}
            - name: COOKIE_SECURE
              value: {{ .Values.env.jwt.secure | quote }}
            - name: COOKIE_SAMESITE
              value: {{ .Values.env.jwt.sameSite }}
            - name: COOKIE_MAXAGE
              value: {{ .Values.env.jwt.maxAge | quote }}
            - name: COOKIE_REFRESHINTERVAL
              value: {{ .Values.env.jwt.refreshInterval | quote }}
            # JVM optimizations for auth service (JWT/crypto intensive)
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0 -XX:+UseG1GC -XX:MaxGCPauseMillis=100 -XX:+ParallelRefProcEnabled -Djava.security.egd=file:/dev/./urandom"
            # Performance tuning for Spring Security
            - name: SPRING_SECURITY_CONCURRENT_SESSIONS_MAXIMUM
              value: "1000"
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          {{- end }}
          {{- if .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          {{- end }}
          {{- if .Values.startupProbe }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          {{- end }}