apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "history-ms.fullname" . }}
  labels:
    {{- include "history-ms.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if .Values.deploymentStrategy }}
  strategy:
    {{- toYaml .Values.deploymentStrategy | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "history-ms.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- if .Values.podAnnotations }}
        {{- toYaml .Values.podAnnotations | nindent 8 }}
        {{- end }}
      labels:
        {{- include "history-ms.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
      {{- if .Values.securityContext }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      {{- end }}
      {{- if and .Values.topologySpreadConstraints .Values.topologySpreadConstraints.enabled }}
      topologySpreadConstraints:
      - maxSkew: {{ .Values.topologySpreadConstraints.maxSkew }}
        topologyKey: {{ .Values.topologySpreadConstraints.topologyKey }}
        whenUnsatisfiable: {{ .Values.topologySpreadConstraints.whenUnsatisfiable }}
        labelSelector:
          matchLabels:
            {{- include "history-ms.selectorLabels" . | nindent 12 }}
      {{- end }}
      {{- if .Values.dnsConfig }}
      dnsConfig:
        {{- toYaml .Values.dnsConfig | nindent 8 }}
      {{- end }}
      {{- if .Values.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- end }}
      {{- if and .Values.initContainers .Values.initContainers.enabled }}
      initContainers:
        - name: wait-for-dependencies
          image: busybox:latest
          command:
            - sh
            - -c
            - |
              echo "Waiting for PostgreSQL..."
              until nc -z {{ .Values.database.host }} {{ .Values.database.port }}; do
                sleep 5
              done
              echo "PostgreSQL ready"
              
              echo "Waiting for RabbitMQ..."
              until nc -z {{ .Values.rabbitmq.host }} {{ .Values.rabbitmq.port }}; do
                sleep 5
              done
              echo "RabbitMQ ready"
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            # Database connection
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName }}
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName }}
                  key: password
            
            # RabbitMQ connection
            - name: SPRING_RABBITMQ_HOST
              value: {{ .Values.rabbitmq.host }}
            - name: SPRING_RABBITMQ_PORT
              value: {{ .Values.rabbitmq.port | quote }}
            - name: SPRING_RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.rabbitmq.secretName }}
                  key: username
            - name: SPRING_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.rabbitmq.secretName }}
                  key: password
            
            {{- if .Values.database_config }}
            # HikariCP connection pool
            - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
              value: {{ .Values.database_config.connection_pool.maximum_pool_size | quote }}
            - name: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
              value: {{ .Values.database_config.connection_pool.minimum_idle | quote }}
            - name: SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT
              value: {{ .Values.database_config.connection_pool.connection_timeout | quote }}
            - name: SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT
              value: {{ .Values.database_config.connection_pool.idle_timeout | quote }}
            - name: SPRING_DATASOURCE_HIKARI_MAX_LIFETIME
              value: {{ .Values.database_config.connection_pool.max_lifetime | quote }}
            - name: SPRING_DATASOURCE_HIKARI_LEAK_DETECTION_THRESHOLD
              value: {{ .Values.database_config.connection_pool.leak_detection_threshold | quote }}
            {{- end }}
            
            {{- if .Values.jpa_config }}
            # JPA/Hibernate batch configuration
            - name: SPRING_JPA_PROPERTIES_HIBERNATE_JDBC_BATCH_SIZE
              value: {{ .Values.jpa_config.jdbc_batch_size | quote }}
            - name: SPRING_JPA_PROPERTIES_HIBERNATE_ORDER_INSERTS
              value: {{ .Values.jpa_config.order_inserts | quote }}
            - name: SPRING_JPA_PROPERTIES_HIBERNATE_ORDER_UPDATES
              value: {{ .Values.jpa_config.order_updates | quote }}
            - name: SPRING_JPA_PROPERTIES_HIBERNATE_JDBC_BATCH_VERSIONED_DATA
              value: {{ .Values.jpa_config.batch_versioned_data | quote }}
            - name: SPRING_JPA_PROPERTIES_HIBERNATE_JDBC_FETCH_SIZE
              value: {{ .Values.jpa_config.jdbc_fetch_size | quote }}
            - name: SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_BATCH_FETCH_SIZE
              value: {{ .Values.jpa_config.default_batch_fetch_size | quote }}
            {{- end }}
            
            {{- if .Values.rabbitmq_config }}
            # RabbitMQ listener configuration
            - name: SPRING_RABBITMQ_LISTENER_SIMPLE_CONCURRENCY
              value: {{ .Values.rabbitmq_config.listener.concurrency | quote }}
            - name: SPRING_RABBITMQ_LISTENER_SIMPLE_MAX_CONCURRENCY
              value: {{ .Values.rabbitmq_config.listener.max_concurrency | quote }}
            - name: SPRING_RABBITMQ_LISTENER_SIMPLE_PREFETCH
              value: {{ .Values.rabbitmq_config.listener.prefetch | quote }}
            - name: SPRING_RABBITMQ_LISTENER_SIMPLE_BATCH_SIZE
              value: {{ .Values.rabbitmq_config.listener.batch_size | quote }}
            - name: SPRING_RABBITMQ_CACHE_CHANNEL_SIZE
              value: {{ .Values.rabbitmq_config.connection.channel_size | quote }}
            - name: SPRING_RABBITMQ_CACHE_CHANNEL_CHECKOUT_TIMEOUT
              value: {{ .Values.rabbitmq_config.connection.checkout_timeout | quote }}
            {{- end }}
            
            {{- if .Values.tomcat_config }}
            # Tomcat configuration
            - name: SERVER_TOMCAT_THREADS_MAX
              value: {{ .Values.tomcat_config.threads.max | quote }}
            - name: SERVER_TOMCAT_THREADS_MIN_SPARE
              value: {{ .Values.tomcat_config.threads.min_spare | quote }}
            - name: SERVER_TOMCAT_ACCEPT_COUNT
              value: {{ .Values.tomcat_config.accept_count | quote }}
            - name: SERVER_TOMCAT_MAX_CONNECTIONS
              value: {{ .Values.tomcat_config.max_connections | quote }}
            {{- end }}
            
            # JVM optimization for batch processing + message consumption
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=65.0 -XX:InitialRAMPercentage=50.0 -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+ParallelRefProcEnabled -XX:+UseStringDeduplication -XX:G1HeapRegionSize=16M"
            
            # Graceful shutdown for RabbitMQ consumers + DB connections
            - name: SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE
              value: "45s"
            - name: SERVER_SHUTDOWN
              value: "graceful"
              
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          {{- end }}
          {{- if .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          {{- end }}
          {{- if .Values.startupProbe }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          {{- end }}
          # Lifecycle hook for graceful RabbitMQ consumer shutdown
          lifecycle:
            preStop:
              exec:
                command:
                - sh
                - -c
                - |
                  # Stop accepting new messages from RabbitMQ
                  echo "Stopping RabbitMQ consumers..."
                  sleep 20
                  # Give time to finish processing in-flight messages
                  echo "Draining in-flight messages..."
                  sleep 25