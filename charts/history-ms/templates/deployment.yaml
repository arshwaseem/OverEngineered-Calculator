apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "history-ms.fullname" . }}
  labels:
    {{- include "history-ms.labels" . | nindent 4 }}

spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "history-ms.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "history-ms.selectorLabels" . | nindent 8 }}
    spec:
      initContainers:
        - name: wait-for-rabbit
          image: busybox:latest
          command:
            - sh
            - -c
            - |
              until nc -z -v -w30 {{ .Release.Name }}-{{ .Values.env.rabbitmq.host }} {{ .Values.env.rabbitmq.port }}; do
                echo "Waiting for RabbitMQ connection..."
                sleep 5
              done
              echo "RabbitMQ is Ready......"

        - name: wait-for-db
          image: postgres:16
          command:
            - sh
            - -c
            - |
              until pg_isready -h {{ .Values.database.host }} -p {{ .Values.database.port }} -U postgres; do
                echo "Waiting for Database connection..."
                sleep 5
              done
              echo "Database is Ready......"

      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName }}
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName }}
                  key: password
            - name: SPRING_RABBITMQ_HOST
              value: "{{ .Release.Name }}-{{ .Values.env.rabbitmq.host }}"
            - name: SPRING_RABBITMQ_PORT
              value: "{{ .Values.env.rabbitmq.port }}"
            - name: SPRING_RABBITMQ_USERNAME
              value: "{{ .Values.env.rabbitmq.username }}"
            - name: SPRING_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "history-ms.fullname" . }}-secret
                  key: rabbitmq-password
          # livenessProbe:
          #   httpGet:
          #     path: /actuator/health/liveness
          #     port: http
          #   initialDelaySeconds: 60
          #   periodSeconds: 20
          #   timeoutSeconds: 5
          # readinessProbe:
          #   httpGet:
          #     path: /actuator/health/readiness
          #     port: http
          #   initialDelaySeconds: 30
          #   periodSeconds: 10
          #   timeoutSeconds: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
