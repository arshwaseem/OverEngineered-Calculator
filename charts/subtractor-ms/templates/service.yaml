apiVersion: v1

kind: Service
metadata:
  name: {{ include "subtractor-ms.fullname" . }}
  labels:
    {{- include "subtractor-ms.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.grpcPort }}
      targetPort: grpc
      protocol: TCP
      name: grpc
  selector:
    {{- include "subtractor-ms.selectorLabels" . | nindent 4 }}