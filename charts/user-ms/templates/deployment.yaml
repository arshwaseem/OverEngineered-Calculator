apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "user-ms.fullname" . }}
  labels:
    {{- include "user-ms.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if .Values.deploymentStrategy }}
  strategy:
    {{- toYaml .Values.deploymentStrategy | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "user-ms.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- if .Values.podAnnotations }}
        {{- toYaml .Values.podAnnotations | nindent 8 }}
        {{- end }}
      labels:
        {{- include "user-ms.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
      {{- if .Values.securityContext }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      {{- end }}
      {{- if and .Values.topologySpreadConstraints .Values.topologySpreadConstraints.enabled }}
      topologySpreadConstraints:
      - maxSkew: {{ .Values.topologySpreadConstraints.maxSkew }}
        topologyKey: {{ .Values.topologySpreadConstraints.topologyKey }}
        whenUnsatisfiable: {{ .Values.topologySpreadConstraints.whenUnsatisfiable }}
        labelSelector:
          matchLabels:
            {{- include "user-ms.selectorLabels" . | nindent 12 }}
      {{- end }}
      {{- if .Values.dnsConfig }}
      dnsConfig:
        {{- toYaml .Values.dnsConfig | nindent 8 }}
      {{- end }}
      {{- if .Values.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- end }}
      {{- if and .Values.initContainers .Values.initContainers.enabled }}
      initContainers:
        - name: wait-for-db
          image: postgres:16
          command:
            - sh
            - -c
            - |
              until pg_isready -h {{ .Values.database.host }} -p {{ .Values.database.port }} -U postgres; do
                echo "Waiting for Database connection..."
                sleep 5
              done
              echo "Database is Ready......"
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            # Database connection
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName }}
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName }}
                  key: password
            
            {{- if .Values.database_config }}
            # HikariCP connection pool configuration
            - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
              value: {{ .Values.database_config.connection_pool.maximum_pool_size | quote }}
            - name: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
              value: {{ .Values.database_config.connection_pool.minimum_idle | quote }}
            - name: SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT
              value: {{ .Values.database_config.connection_pool.connection_timeout | quote }}
            - name: SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT
              value: {{ .Values.database_config.connection_pool.idle_timeout | quote }}
            - name: SPRING_DATASOURCE_HIKARI_MAX_LIFETIME
              value: {{ .Values.database_config.connection_pool.max_lifetime | quote }}
            - name: SPRING_DATASOURCE_HIKARI_LEAK_DETECTION_THRESHOLD
              value: {{ .Values.database_config.connection_pool.leak_detection_threshold | quote }}
            - name: SPRING_DATASOURCE_HIKARI_CONNECTION_TEST_QUERY
              value: {{ .Values.database_config.health_check_query | quote }}
            {{- end }}
            
            {{- if .Values.jpa_config }}
            # JPA/Hibernate configuration
            - name: SPRING_JPA_PROPERTIES_HIBERNATE_JDBC_BATCH_SIZE
              value: {{ .Values.jpa_config.jdbc_batch_size | quote }}
            - name: SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_BATCH_FETCH_SIZE
              value: {{ .Values.jpa_config.default_batch_fetch_size | quote }}
            - name: SPRING_JPA_PROPERTIES_HIBERNATE_ORDER_INSERTS
              value: {{ .Values.jpa_config.order_inserts | quote }}
            - name: SPRING_JPA_PROPERTIES_HIBERNATE_ORDER_UPDATES
              value: {{ .Values.jpa_config.order_updates | quote }}
            - name: SPRING_JPA_PROPERTIES_HIBERNATE_GENERATE_STATISTICS
              value: {{ .Values.jpa_config.generate_statistics | quote }}
            {{- if .Values.jpa_config.enable_second_level_cache }}
            - name: SPRING_JPA_PROPERTIES_HIBERNATE_CACHE_USE_SECOND_LEVEL_CACHE
              value: "true"
            - name: SPRING_JPA_PROPERTIES_HIBERNATE_CACHE_USE_QUERY_CACHE
              value: "true"
            {{- end }}
            {{- end }}
            
            # JVM optimization for database-intensive workloads
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=70.0 -XX:InitialRAMPercentage=50.0 -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+ParallelRefProcEnabled -XX:+UseStringDeduplication"
            
            # Graceful shutdown - finish processing requests and close DB connections
            - name: SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE
              value: "30s"
            - name: SERVER_SHUTDOWN
              value: "graceful"
              
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          {{- end }}
          {{- if .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          {{- end }}
          {{- if .Values.startupProbe }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          {{- end }}
          # Lifecycle hook for graceful shutdown
          lifecycle:
            preStop:
              exec:
                command:
                - sh
                - -c
                - sleep 15  # Give time for load balancer to remove pod from rotation