name: CI Pipeline for Overengineered Calculator

on:
  push:
    branches:
      - main
      - ci-pipeline
      - observability
      - tracing
      - e2e-testing
      - tests
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: arshwaseem/overengineered-calculator

jobs:
  # Building and testing with Maven
  build:
    name: build ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - adder-ms
          - subtractor-ms
          - multiplier-ms
          - divider-ms
          - api-gateway
          - history-ms
          - auth
          - user-ms

    steps:
      - name: checkout-code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test with Maven (includes JaCoCo)
        working-directory: ./${{ matrix.service }}
        run: mvn clean verify jacoco:report

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.service }}
          path: ./${{ matrix.service }}/target/surefire-reports/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload JaCoCo Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-${{ matrix.service }}
          path: ./${{ matrix.service }}/target/site/jacoco/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Coverage Data (XML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-${{ matrix.service }}
          path: ./${{ matrix.service }}/target/site/jacoco/jacoco.xml
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Jar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-jar
          path: ./${{ matrix.service }}/target/*.jar
          retention-days: 1
          if-no-files-found: error

  # Generate consolidated coverage report
  coverage-report:
    name: Coverage Report
    needs: build
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: checkout-code
        uses: actions/checkout@v4

      - name: Download all coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-data-*
          path: ./coverage-data

      - name: Display coverage structure
        run: |
          echo "📊 Coverage Data Structure:"
          find ./coverage-data -name "jacoco.xml" -type f

      - name: Generate Coverage Summary
        id: coverage
        run: |
          echo "## 📊 Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Coverage Report |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|----------------|" >> $GITHUB_STEP_SUMMARY
          
          for service in adder-ms subtractor-ms multiplier-ms divider-ms api-gateway history-ms auth user-ms; do
            if [ -f "./coverage-data/coverage-data-${service}/jacoco.xml" ]; then
              # Extract coverage percentage using grep and awk
              COVERAGE=$(grep -oP 'type="INSTRUCTION".*?missed="\K[0-9]+' ./coverage-data/coverage-data-${service}/jacoco.xml | head -1)
              COVERED=$(grep -oP 'type="INSTRUCTION".*?covered="\K[0-9]+' ./coverage-data/coverage-data-${service}/jacoco.xml | head -1)
          
              if [ -n "$COVERAGE" ] && [ -n "$COVERED" ]; then
                TOTAL=$((COVERAGE + COVERED))
                if [ $TOTAL -gt 0 ]; then
                  PERCENTAGE=$(awk "BEGIN {printf \"%.1f\", ($COVERED / $TOTAL) * 100}")
          
                  # Color coding
                  if (( $(echo "$PERCENTAGE >= 80" | bc -l) )); then
                    EMOJI="🟢"
                    BADGE="![](https://img.shields.io/badge/coverage-${PERCENTAGE}%25-brightgreen)"
                  elif (( $(echo "$PERCENTAGE >= 60" | bc -l) )); then
                    EMOJI="🟡"
                    BADGE="![](https://img.shields.io/badge/coverage-${PERCENTAGE}%25-yellow)"
                  else
                    EMOJI="🔴"
                    BADGE="![](https://img.shields.io/badge/coverage-${PERCENTAGE}%25-red)"
                  fi
          
                  echo "| ${service} | ${EMOJI} ${PERCENTAGE}% ${BADGE} |" >> $GITHUB_STEP_SUMMARY
                else
                  echo "| ${service} | ⚪ N/A |" >> $GITHUB_STEP_SUMMARY
                fi
              else
                echo "| ${service} | ⚪ N/A |" >> $GITHUB_STEP_SUMMARY
              fi
            else
              echo "| ${service} | ⚠️ No coverage data |" >> $GITHUB_STEP_SUMMARY
            fi
          done
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📈 Coverage Legend" >> $GITHUB_STEP_SUMMARY
          echo "- 🟢 **Excellent**: ≥80% coverage" >> $GITHUB_STEP_SUMMARY
          echo "- 🟡 **Good**: 60-79% coverage" >> $GITHUB_STEP_SUMMARY
          echo "- 🔴 **Needs Improvement**: <60% coverage" >> $GITHUB_STEP_SUMMARY
          echo "- ⚪ **N/A**: No coverage data" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "💡 **Tip**: Click on the 'jacoco-report-*' artifacts above to download detailed HTML coverage reports" >> $GITHUB_STEP_SUMMARY

  # Build and push container images to ghcr
  docker-java-services:
    name: Docker ${{ matrix.service }}
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    strategy:
      matrix:
        service:
          - adder-ms
          - subtractor-ms
          - divider-ms
          - multiplier-ms
          - api-gateway
          - auth
          - user-ms
          - history-ms

    permissions:
      contents: read
      packages: write

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: download jar artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.service }}-jar
          path: ./${{ matrix.service }}/target

      - name: setup docker buildx
        uses: docker/setup-buildx-action@v3

      - name: login to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: extract docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: create optimized docker file for CI
        working-directory: ./${{ matrix.service }}
        run: |
          cat > Dockerfile.ci <<'EOF'
          FROM eclipse-temurin:17-jre
          WORKDIR /app
          ENV JAVA_OPTS="-XX:+UseG1GC"
          EXPOSE 8080
          COPY target/*.jar /app/app.jar
          ENTRYPOINT ["sh", "-c", "java $JAVA_OPTS -jar /app/app.jar"]
          EOF

      - name: build and push docker images
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile.ci
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  docker-frontend:
    name: Docker Frontend
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup docker buildx
        uses: docker/setup-buildx-action@v3

      - name: login to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: extract docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: build and push docker images
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  pipeline-success:
    name: Pipeline Success
    needs: [build, coverage-report, docker-java-services, docker-frontend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: extract branch name
        id: branch
        run: echo "name=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT

      - name: Summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          ##Pipeline Success

          All services built, tested, and pushed successfully!

          ###Java Microservices
          EOF
          echo "Branch: \`${{ steps.branch.outputs.name }}\`" >> $GITHUB_STEP_SUMMARY
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'

          | Service | Image |
          |---------|-------|
          EOF
          echo "| Adder | \`ghcr.io/${{ env.IMAGE_PREFIX }}/adder-ms:${{ steps.branch.outputs.name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Subtractor | \`ghcr.io/${{ env.IMAGE_PREFIX }}/subtractor-ms:${{ steps.branch.outputs.name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Multiplier | \`ghcr.io/${{ env.IMAGE_PREFIX }}/multiplier-ms:${{ steps.branch.outputs.name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Divider | \`ghcr.io/${{ env.IMAGE_PREFIX }}/divider-ms:${{ steps.branch.outputs.name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| API Gateway | \`ghcr.io/${{ env.IMAGE_PREFIX }}/api-gateway:${{ steps.branch.outputs.name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Auth | \`ghcr.io/${{ env.IMAGE_PREFIX }}/auth:${{ steps.branch.outputs.name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| User | \`ghcr.io/${{ env.IMAGE_PREFIX }}/user-ms:${{ steps.branch.outputs.name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| History | \`ghcr.io/${{ env.IMAGE_PREFIX }}/history-ms:${{ steps.branch.outputs.name }}\` |" >> $GITHUB_STEP_SUMMARY
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'

          ###Frontend
          | Component | Image |
          |-----------|-------|
          EOF
          echo "| Frontend | \`ghcr.io/${{ env.IMAGE_PREFIX }}/frontend:${{ steps.branch.outputs.name }}\` |" >> $GITHUB_STEP_SUMMARY
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'

          ###Code Coverage
          Check the **Coverage Report** job above for detailed coverage metrics!
          
          **Tip**: Download the `jacoco-report-*` artifacts to view detailed HTML coverage reports for each service.
          EOF